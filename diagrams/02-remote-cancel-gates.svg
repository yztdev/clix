<text x="40" y="46" font-size="22" font-weight="bold" fill="#16233a">clix 中断时序（二）：Remote 会话的「三道闸」取消</text>
<text x="40" y="72" font-size="13" fill="#5b6b7f">客户端发 cancel 帧后：先关输出闸，再设 token / 中断线程，再 abort HTTP，最后 8 秒兜底终态</text>
