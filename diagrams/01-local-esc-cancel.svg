<text x="40" y="46" font-size="22" font-weight="bold" fill="#16233a">clix 中断时序（一）：交互 CLI 按 ESC 取消一次任务</text>
<text x="40" y="72" font-size="13" fill="#5b6b7f">协作式取消：全局 token + 线程 interrupt，各层在边界处主动检查；Agent 跑在独立 daemon 线程上，主线程负责监听 ESC</text>
